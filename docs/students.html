        <figure class="story-quote">
          <h2>The Hermit’s Reasoning</h2>
          <blockquote>
            <p>A hermit sat peacefully in the sunshine, enjoying a cup of tea.</p>
            <p>A man saw him there in the morning, again in the afternoon, and still there in the evening. Finally, he asked impatiently, “Have you nothing to do? How can you waste the whole day sitting in the sun?”</p>
            <p>The hermit smiled. “My son, what should I be doing?”</p>
            <p>“You should work.”</p>
            <p>“And why?”</p>
            <p>“To earn money.”</p>
            <p>“And what would money give me?”</p>
            <p>“A fine house, a comfortable life, and perhaps excellent tea delivered to you, so that one day you can relax and enjoy it in the sunshine.”</p>
            <p>The hermit took another sip and replied:</p>
            <p>“But my son, that is exactly what I am doing now.”</p>
          </blockquote>
          <figcaption>
            <span class="proverb-zh" lang="zh-Hans">知足者富</span>
            <span class="proverb-pinyin">Zhī zú zhě fù</span>
            <span class="proverb-en">“One who knows contentment is rich.”</span>
            <cite>Laozi, Dao De Jing, chapter 33</cite>
          </figcaption>
        </figure>
